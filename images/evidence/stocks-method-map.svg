<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="title desc">
  <title id="title">ETF forecasting method map</title>
  <desc id="desc">The notebook compares two model families against historical Yahoo Finance OHLCV data.</desc>
  <rect width="840" height="420" rx="20" fill="#f8fafc"/>
  <text x="36" y="42" fill="#172033" font-family="Arial, sans-serif" font-size="22" font-weight="700">ETF forecasting method map</text>
  <text x="36" y="68" fill="#5f6e84" font-family="Arial, sans-serif" font-size="13">The notebook compares two model families against historical Yahoo Finance OHLCV data.</text>
  <rect x="40" y="142" width="142" height="92" rx="14" fill="#ffffff" stroke="#9db4d0" stroke-width="2"/>
  <text x="111.0" y="177" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="14" font-weight="700">OHLCV</text>
  <text x="111.0" y="201" text-anchor="middle" fill="#5f6e84" font-family="Arial, sans-serif" font-size="11">Yahoo Finance</text>
  <path d="M 190 188.0 H 208" stroke="#2165d6" stroke-width="3" fill="none"/>
  <path d="M 208 188.0 l -9 -6 v 12 z" fill="#2165d6"/>
  <rect x="216" y="142" width="142" height="92" rx="14" fill="#ffffff" stroke="#9db4d0" stroke-width="2"/>
  <text x="287.0" y="177" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="14" font-weight="700">ARIMA</text>
  <text x="287.0" y="201" text-anchor="middle" fill="#5f6e84" font-family="Arial, sans-serif" font-size="11">classical</text>
  <path d="M 366 188.0 H 384" stroke="#2165d6" stroke-width="3" fill="none"/>
  <path d="M 384 188.0 l -9 -6 v 12 z" fill="#2165d6"/>
  <rect x="392" y="142" width="142" height="92" rx="14" fill="#ffffff" stroke="#9db4d0" stroke-width="2"/>
  <text x="463.0" y="177" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="14" font-weight="700">LSTM</text>
  <text x="463.0" y="201" text-anchor="middle" fill="#5f6e84" font-family="Arial, sans-serif" font-size="11">recurrent</text>
  <path d="M 542 188.0 H 560" stroke="#2165d6" stroke-width="3" fill="none"/>
  <path d="M 560 188.0 l -9 -6 v 12 z" fill="#2165d6"/>
  <rect x="568" y="142" width="142" height="92" rx="14" fill="#ffffff" stroke="#9db4d0" stroke-width="2"/>
  <text x="639.0" y="177" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="14" font-weight="700">MSE</text>
  <text x="639.0" y="201" text-anchor="middle" fill="#5f6e84" font-family="Arial, sans-serif" font-size="11">compare</text>
  <rect x="40" y="286" width="760" height="74" rx="12" fill="#edf7f3"/>
  <text x="60" y="317" fill="#12775b" font-family="Arial, sans-serif" font-size="13" font-weight="700">External data required: the repository does not include a static price-history file.</text>
  <text x="60" y="341" fill="#5f6e84" font-family="Arial, sans-serif" font-size="12">This visual distinguishes a reproducible method map from a measured model result.</text>
</svg>
