<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="title desc">
  <title id="title">Churn rate by contract</title>
  <desc id="desc">Computed from 7,043 repository rows; percent of customers marked Churn = Yes.</desc>
  <rect width="840" height="420" rx="20" fill="#f8fafc"/>
  <text x="36" y="42" fill="#172033" font-family="Arial, sans-serif" font-size="22" font-weight="700">Churn rate by contract</text>
  <text x="36" y="68" fill="#5f6e84" font-family="Arial, sans-serif" font-size="13">Computed from 7,043 repository rows; percent of customers marked Churn = Yes.</text>
  <text x="56" y="94" fill="#2165d6" font-family="Arial, sans-serif" font-size="12" font-weight="700">CHURN RATE (%)</text>
  <line x1="56" y1="350" x2="784" y2="350" stroke="#cbd5e1"/>
  <rect x="140.3" y="112.0" width="74.0" height="238.0" rx="7" fill="#2165d6" opacity=".88"/>
  <text x="177.3" y="102.0" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="12" font-weight="700">42.7%</text>
  <text x="177.3" y="374" text-anchor="middle" fill="#5f6e84" font-family="Arial, sans-serif" font-size="11">Monthly</text>
  <rect x="383.0" y="287.2" width="74.0" height="62.8" rx="7" fill="#2165d6" opacity=".88"/>
  <text x="420.0" y="277.2" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="12" font-weight="700">11.3%</text>
  <text x="420.0" y="374" text-anchor="middle" fill="#5f6e84" font-family="Arial, sans-serif" font-size="11">One year</text>
  <rect x="625.7" y="334.2" width="74.0" height="15.8" rx="7" fill="#2165d6" opacity=".88"/>
  <text x="662.7" y="324.2" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="12" font-weight="700">2.8%</text>
  <text x="662.7" y="374" text-anchor="middle" fill="#5f6e84" font-family="Arial, sans-serif" font-size="11">Two year</text>
</svg>
