  <text x="420.0" y="201" text-anchor="middle" fill="#5f6e84" font-family="Arial, sans-serif" font-size="11">balance</text>
  <path d="M 494.40000000000003 188.0 H 502.40000000000003" stroke="#2165d6" stroke-width="3" fill="none"/>
  <path d="M 502.40000000000003 188.0 l -9 -6 v 12 z" fill="#2165d6"/>
