  <text x="576.8000000000001" y="201" text-anchor="middle" fill="#5f6e84" font-family="Arial, sans-serif" font-size="11">overall</text>
  <path d="M 651.2 188.0 H 659.2" stroke="#2165d6" stroke-width="3" fill="none"/>
