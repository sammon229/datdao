<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="title desc">
  <title id="title">Fraud evaluation frame</title>
  <desc id="desc">The project keeps five evaluation lenses visible instead of treating accuracy as the answer.</desc>
  <rect width="840" height="420" rx="20" fill="#f8fafc"/>
