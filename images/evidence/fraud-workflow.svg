  <text x="60" y="317" fill="#12775b" font-family="Arial, sans-serif" font-size="13" font-weight="700">The visual is a method artifact because the source transaction rows are not redistributed.</text>
  <text x="60" y="341" fill="#5f6e84" font-family="Arial, sans-serif" font-size="12">This visual distinguishes a reproducible method map from a measured model result.</text>
