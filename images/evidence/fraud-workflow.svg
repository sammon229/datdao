<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="title desc">
  <title id="title">Fraud decision workflow</title>
  <desc id="desc">A transparent review loop connects model output to investigator action.</desc>
